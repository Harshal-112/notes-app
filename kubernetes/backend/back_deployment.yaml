kind: Deployment
apiVersion: apps/v1
metadata:
  name: notes-app-backend
  namespace: notes-app-ns
  labels:
    app: notes-app-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app-backend

  template:
    metadata:
      name: notes-app-backend
      labels:
        app: notes-app-backend

    spec:
      restartPolicy: Always
      containers:
        - name: notes-app-backend-container
          image: harshal345/notes-app_backend
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          env:
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "localhost,127.0.0.1"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost"
            - name: DB_HOST
              value: postgresql-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: SECRET_KEY
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /api/notes/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/notes/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
