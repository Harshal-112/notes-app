kind: Deployment
apiVersion: apps/v1
metadata:
  name: notes-app-frontend
  namespace: notes-app-ns
  labels:
    app: notes-app-frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app-frontend

  template:
    metadata:
      name: notes-app-frontend
      labels:
        app: notes-app-frontend

    spec:
      restartPolicy: Always
      containers:
        - name: notes-app-frontend-container
          image: harshal345/notes-app_frontend
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

